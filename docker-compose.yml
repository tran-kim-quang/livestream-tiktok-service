services:
  livestream-service:
    build: .
    container_name: livestream-service
    restart: unless-stopped
    ports:
      - "${LIVESTREAM_SERVICE_PORT:-8002}:8002"
    env_file:
      - .env
    environment:
      GPU_LOCAL_HOST: host.docker.internal
      GPU_SSH_KEY: /run/secrets/gpu_ssh_key
      # Container không có sound device; chạy scripts/audio-bridge.ps1 trên Windows host.
      AUDIO_PLAYER: none
      AGENT_LOCAL_PLAYBACK: "0"
    volumes:
      # Đổi GPU_SSH_KEY_HOST_PATH nếu private key nằm ở đường dẫn khác trên host.
      - "${GPU_SSH_KEY_HOST_PATH:-~/.ssh/gpu_voicestudio_ed25519}:/run/secrets/gpu_ssh_key:ro"
      # File ngữ cảnh live cho similarity scoring (COMMENT_CONTEXT_FILE=context/...); sửa xong chỉ cần restart.
      - "./context:/app/context:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"
